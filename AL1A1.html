<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أَيْنَ حَرْفُ م ؟</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:20px;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:'Amiri', serif;
    overflow:hidden;
}

.game-box{
    position:relative;
    width:95%;
    max-width:850px;
    background:#fff2bf;
    border-radius:40px;
    padding:40px 20px;
    text-align:center;
    overflow:hidden;
    box-sizing:border-box;
}

/* formes décoratives */

.shape1{
    position:absolute;
    width:260px;
    height:260px;
    background:#cddc39;
    border-radius:50%;
    bottom:-120px;
    left:-80px;
}

.shape2{
    position:absolute;
    width:320px;
    height:320px;
    background:#ffc400;
    border-radius:50%;
    bottom:-140px;
    right:-100px;
}

.shape3{
    position:absolute;
    width:180px;
    height:180px;
    background:#81d4e8;
    border-radius:50%;
    bottom:-90px;
    right:120px;
}

.shape4{
    position:absolute;
    width:160px;
    height:160px;
    background:#efb0b0;
    border-radius:50%;
    bottom:-70px;
    left:240px;
}

/* contenu */

.content{
    position:relative;
    z-index:2;
}

.title{
    font-size:58px;
    color:#e91e63;
    margin-bottom:10px;
    font-weight:bold;
}

.subtitle{
    font-size:38px;
    color:#37a9c5;
    margin-bottom:25px;
    font-weight:bold;
}

.word{
    font-size:85px;
    color:#333;
    margin:25px 0 35px;
    font-family:Arial, sans-serif;
    font-weight:bold;
}

.answers{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.answer-btn{
    background:white;
    border:5px solid #cddc39;
    border-radius:25px;
    padding:14px 28px;
    font-size:32px;
    cursor:pointer;
    transition:0.3s;
    min-width:180px;
    font-family:'Amiri', serif;
    color:#333;
    font-weight:bold;
}

.answer-btn:hover{
    transform:scale(1.05);
}

.answer-btn.selected{
    background:#eef7b1;
}

.answer-btn.correct{
    background:#37a9c5;
    color:white;
    border-color:#37a9c5;
}

.answer-btn.wrong{
    background:#ef5350;
    color:white;
    border-color:#d32f2f;
}

.check-btn{
    background:#37a9c5;
    color:white;
    border:none;
    border-radius:35px;
    padding:14px 45px;
    font-size:34px;
    cursor:pointer;
    font-family:'Amiri', serif;
    font-weight:bold;
    transition:0.3s;
}

.check-btn:hover{
    transform:scale(1.05);
}

.feedback{
    margin-top:20px;
    font-size:34px;
    font-weight:bold;
    min-height:45px;
    color:#333;
}

/* responsive */

@media(max-width:768px){

    .title{
        font-size:38px;
    }

    .subtitle{
        font-size:26px;
    }

    .word{
        font-size:58px;
    }

    .answer-btn{
        font-size:22px;
        min-width:130px;
        padding:10px 16px;
    }

    .check-btn{
        font-size:24px;
        padding:10px 28px;
    }

    .feedback{
        font-size:24px;
    }

    .shape1{
        width:180px;
        height:180px;
    }

    .shape2{
        width:220px;
        height:220px;
    }
}

</style>
</head>

<body>

<div class="game-box">

    <!-- formes décoratives -->
    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="shape4"></div>

    <!-- contenu -->
    <div class="content">

        <div class="title">
            أَيْنَ حَرْفُ م ؟
        </div>

        <div class="subtitle">
            اِخْتَرِ الإِجَابَةَ الصَّحِيحَةَ
        </div>

        <div class="word">
            مَدْرَسَةٌ
        </div>

        <div class="answers">

            <button class="answer-btn" data-answer="last">
                فِي الأَخِير
            </button>

            <button class="answer-btn" data-answer="middle">
                فِي الوَسَط
            </button>

            <button class="answer-btn" data-answer="first">
                فِي الأَوَّل
            </button>

        </div>

        <button class="check-btn" onclick="checkAnswer()">
            تَحَقَّقْ
        </button>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

let selectedAnswer = "";

const buttons = document.querySelectorAll(".answer-btn");

buttons.forEach(button => {

    button.addEventListener("click", () => {

        buttons.forEach(btn => {
            btn.classList.remove("selected","correct","wrong");
        });

        button.classList.add("selected");

        selectedAnswer = button.dataset.answer;

        document.getElementById("feedback").innerHTML = "";

    });

});

function checkAnswer(){

    const feedback = document.getElementById("feedback");

    if(selectedAnswer === ""){

        feedback.innerHTML = "⚠️ اِخْتَرْ إِجَابَةً";

        return;
    }

    buttons.forEach(btn => {

        btn.classList.remove("correct","wrong");

    });

    if(selectedAnswer === "first"){

        buttons.forEach(btn => {

            if(btn.dataset.answer === "first"){

                btn.classList.add("correct");

            }

        });

        feedback.innerHTML = "✅ أَحْسَنْتَ";

    }else{

        buttons.forEach(btn => {

            if(btn.dataset.answer === selectedAnswer){

                btn.classList.add("wrong");

            }

        });

        feedback.innerHTML = "❌ حَاوِلْ مَرَّةً أُخْرَى";

    }
}

</script>

</body>
</html>
