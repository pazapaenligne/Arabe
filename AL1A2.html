<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لُعْبَةُ المِيمِ</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:5px;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    font-family:'Amiri', serif;
    overflow:hidden;
}

.game-box{
    position:relative;
    width:95%;
    max-width:820px;
    background:#fff2bf;
    border-radius:35px;
    padding:20px 15px 30px;
    text-align:center;
    overflow:hidden;
    box-sizing:border-box;
}

/* décor */

.shape1{
    position:absolute;
    width:170px;
    height:170px;
    background:#cddc39;
    border-radius:50%;
    bottom:-90px;
    left:-60px;
}

.shape2{
    position:absolute;
    width:220px;
    height:220px;
    background:#ffc400;
    border-radius:50%;
    bottom:-120px;
    right:-70px;
}

.shape3{
    position:absolute;
    width:120px;
    height:120px;
    background:#81d4e8;
    border-radius:50%;
    bottom:-70px;
    right:160px;
}

.shape4{
    position:absolute;
    width:100px;
    height:100px;
    background:#efb0b0;
    border-radius:50%;
    bottom:-55px;
    left:260px;
}

/* contenu */

.content{
    position:relative;
    z-index:2;
}

.subtitle{
    font-size:26px;
    color:#37a9c5;
    margin-bottom:20px;
    font-weight:bold;
}

.answers{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.answer-btn{
    background:#f3f3f3;
    border:5px solid #cddc39;
    border-radius:28px;
    padding:10px 22px;
    font-size:28px;
    cursor:pointer;
    transition:0.3s;
    min-width:120px;
    font-family:'Amiri', serif;
    color:#333;
    font-weight:bold;
}

.answer-btn.selected{
    background:#eef7b1;
}

.answer-btn.correct{
    background:#37a9c5;
    color:white;
    border-color:#37a9c5;
}

.answer-btn.wrong{
    background:#ef5350;
    color:white;
    border-color:#d32f2f;
}

.check-btn{
    background:#37a9c5;
    color:white;
    border:none;
    border-radius:30px;
    padding:8px 28px;
    font-size:26px;
    cursor:pointer;
    font-family:'Amiri', serif;
    font-weight:bold;
}

.feedback{
    margin-top:10px;
    font-size:24px;
    font-weight:bold;
    min-height:30px;
    color:#333;
}

@media(max-width:768px){

    .subtitle{
        font-size:22px;
    }

    .answer-btn{
        font-size:22px;
        min-width:90px;
        padding:8px 15px;
    }

    .check-btn{
        font-size:22px;
        padding:8px 22px;
    }

    .feedback{
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="game-box">

    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="shape4"></div>

    <div class="content">

        <div class="subtitle">
            اِخْتَرِ الكَلِمَةَ الَّتِي فِيهَا حَرْفُ م
        </div>

        <div class="answers">

            <button class="answer-btn" data-answer="correct">
                قَلَمٌ
            </button>

            <button class="answer-btn" data-answer="wrong1">
                كِتَابٌ
            </button>

            <button class="answer-btn" data-answer="wrong2">
                وَلَدٌ
            </button>

        </div>

        <button class="check-btn" onclick="checkAnswer()">
            تَحَقَّقْ
        </button>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

let selectedAnswer = "";

const buttons = document.querySelectorAll(".answer-btn");

buttons.forEach(button => {

    button.addEventListener("click", () => {

        buttons.forEach(btn => {
            btn.classList.remove("selected","correct","wrong");
        });

        button.classList.add("selected");

        selectedAnswer = button.dataset.answer;

        document.getElementById("feedback").innerHTML = "";

    });

});

function checkAnswer(){

    const feedback = document.getElementById("feedback");

    if(selectedAnswer === ""){

        feedback.innerHTML = "⚠️ اِخْتَرْ إِجَابَةً";
        return;
    }

    buttons.forEach(btn => {

        btn.classList.remove("correct","wrong");

    });

    if(selectedAnswer === "correct"){

        buttons.forEach(btn => {

            if(btn.dataset.answer === "correct"){

                btn.classList.add("correct");

            }

        });

        feedback.innerHTML = "✅ أَحْسَنْتَ";

    }else{

        buttons.forEach(btn => {

            if(btn.dataset.answer === selectedAnswer){

                btn.classList.add("wrong");

            }

        });

        feedback.innerHTML = "❌ حَاوِلْ مَرَّةً أُخْرَى";
    }
}

</script>

</body>
</html>
