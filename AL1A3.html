<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:20px;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:'Amiri', serif;
    overflow:hidden;
}

.game-box{
    position:relative;
    width:95%;
    max-width:850px;
    background:#fff2bf;
    border-radius:40px;
    padding:40px 20px;
    text-align:center;
    overflow:hidden;
    box-sizing:border-box;
}

/* décor */

.shape1{
    position:absolute;
    width:260px;
    height:260px;
    background:#cddc39;
    border-radius:50%;
    bottom:-120px;
    left:-80px;
}

.shape2{
    position:absolute;
    width:320px;
    height:320px;
    background:#ffc400;
    border-radius:50%;
    bottom:-140px;
    right:-100px;
}

.shape3{
    position:absolute;
    width:180px;
    height:180px;
    background:#81d4e8;
    border-radius:50%;
    bottom:-90px;
    right:120px;
}

.shape4{
    position:absolute;
    width:160px;
    height:160px;
    background:#efb0b0;
    border-radius:50%;
    bottom:-70px;
    left:240px;
}

/* contenu */

.content{
    position:relative;
    z-index:2;
}

.subtitle{
    font-size:38px;
    color:#37a9c5;
    margin-bottom:25px;
    font-weight:bold;
}

.word{
    font-size:85px;
    color:#333;
    margin:25px 0 35px;
    font-family:Arial, sans-serif;
    font-weight:bold;
}

.answers{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

.answer-btn{
    width:170px;
    height:170px;
    background:#f3f3f3;
    border:8px solid #cddc39;
    border-radius:35px;
    font-size:90px;
    cursor:pointer;
    transition:0.3s;
    font-family:'Amiri', serif;
    color:#333;
    display:flex;
    justify-content:center;
    align-items:center;
}

.answer-btn:hover{
    transform:scale(1.05);
}

.answer-btn.selected{
    background:#eef7b1;
}

.answer-btn.correct{
    background:#37a9c5;
    color:white;
    border-color:#37a9c5;
}

.answer-btn.wrong{
    background:#ef5350;
    color:white;
    border-color:#d32f2f;
}

.check-btn{
    background:#37a9c5;
    color:white;
    border:none;
    border-radius:35px;
    padding:14px 45px;
    font-size:34px;
    cursor:pointer;
    font-family:'Amiri', serif;
    font-weight:bold;
}

.feedback{
    margin-top:20px;
    font-size:34px;
    font-weight:bold;
    min-height:45px;
    color:#333;
}

/* responsive */

@media(max-width:768px){

    .subtitle{
        font-size:26px;
    }

    .word{
        font-size:58px;
    }

    .answer-btn{
        width:110px;
        height:110px;
        font-size:60px;
    }

    .check-btn{
        font-size:24px;
        padding:10px 28px;
    }

    .feedback{
        font-size:24px;
    }
}

</style>
</head>

<body>

<div class="game-box">

    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="shape4"></div>

    <div class="content">

        <div class="subtitle">
            اِخْتَرِ الحَرَكَةَ المُنَاسِبَةَ
        </div>

        <div class="word">
            مَوْزٌ
        </div>

        <div class="answers">

            <button class="answer-btn" data-answer="ma">
                مَ
            </button>

            <button class="answer-btn" data-answer="mu">
                مُ
            </button>

            <button class="answer-btn" data-answer="mi">
                مِ
            </button>

        </div>

        <button class="check-btn" onclick="checkAnswer()">
            تَحَقَّقْ
        </button>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

let selectedAnswer = "";

const buttons = document.querySelectorAll(".answer-btn");

buttons.forEach(button => {

    button.addEventListener("click", () => {

        buttons.forEach(btn => {
            btn.classList.remove("selected","correct","wrong");
        });

        button.classList.add("selected");

        selectedAnswer = button.dataset.answer;

        document.getElementById("feedback").innerHTML = "";

    });

});

function checkAnswer(){

    const feedback = document.getElementById("feedback");

    if(selectedAnswer === ""){

        feedback.innerHTML = "⚠️ اِخْتَرْ إِجَابَةً";

        return;
    }

    buttons.forEach(btn => {

        btn.classList.remove("correct","wrong");

    });

    if(selectedAnswer === "ma"){

        buttons.forEach(btn => {

            if(btn.dataset.answer === "ma"){

                btn.classList.add("correct");

            }

        });

        feedback.innerHTML = "✅ أَحْسَنْتَ";

    }else{

        buttons.forEach(btn => {

            if(btn.dataset.answer === selectedAnswer){

                btn.classList.add("wrong");

            }

        });

        feedback.innerHTML = "❌ حَاوِلْ مَرَّةً أُخْرَى";

    }
}

</script>

</body>
</html>
