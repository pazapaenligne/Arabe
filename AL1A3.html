<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    font-family:'Amiri', serif;
    overflow:hidden;
}

.game-box{
    position:relative;
    width:95%;
    max-width:1150px;
    background:#fff2bf;
    border-radius:40px;
    padding:25px 20px 35px;
    text-align:center;
    overflow:hidden;
    box-sizing:border-box;
}

.shape1{
    position:absolute;
    width:260px;
    height:260px;
    background:#cddc39;
    border-radius:50%;
    bottom:-140px;
    left:-90px;
}

.shape2{
    position:absolute;
    width:320px;
    height:320px;
    background:#ffc400;
    border-radius:50%;
    bottom:-170px;
    right:-100px;
}

.shape3{
    position:absolute;
    width:180px;
    height:180px;
    background:#81d4e8;
    border-radius:50%;
    bottom:-100px;
    right:260px;
}

.shape4{
    position:absolute;
    width:150px;
    height:150px;
    background:#efb0b0;
    border-radius:50%;
    bottom:-85px;
    left:380px;
}

.content{
    position:relative;
    z-index:2;
}

.subtitle{
    font-size:36px;
    color:#37a9c5;
    margin-bottom:10px;
    font-weight:bold;
}

.word{
    font-size:72px;
    color:#333;
    margin:5px 0 25px;
    font-family:Arial, sans-serif;
    font-weight:bold;
}

.answers{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.answer-btn{
    width:170px;
    height:135px;
    background:white;
    border:6px solid #cddc39;
    border-radius:30px;
    font-size:72px;
    cursor:pointer;
    transition:0.3s;
    font-family:'Amiri', serif;
    color:#333;
    font-weight:bold;
}

.answer-btn.selected{
    background:#eef7b1;
}

.answer-btn.correct{
    background:#37a9c5;
    color:white;
    border-color:#37a9c5;
}

.answer-btn.wrong{
    background:#ef5350;
    color:white;
    border-color:#d32f2f;
}

.check-btn{
    background:#37a9c5;
    color:white;
    border:none;
    border-radius:35px;
    padding:10px 45px;
    font-size:32px;
    cursor:pointer;
    font-family:'Amiri', serif;
    font-weight:bold;
}

.feedback{
    margin-top:12px;
    font-size:28px;
    font-weight:bold;
    min-height:35px;
    color:#333;
}
</style>
</head>

<body>

<div class="game-box">

    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="shape4"></div>

    <div class="content">

        <div class="subtitle">اِخْتَرِ الحَرَكَةَ المُنَاسِبَةَ</div>

        <div class="word">مَوْزٌ</div>

        <div class="answers">
            <button class="answer-btn" data-answer="ma">مَ</button>
            <button class="answer-btn" data-answer="mu">مُ</button>
            <button class="answer-btn" data-answer="mi">مِ</button>
        </div>

        <button class="check-btn" onclick="checkAnswer()">تَحَقَّقْ</button>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>
let selectedAnswer = "";
const buttons = document.querySelectorAll(".answer-btn");

buttons.forEach(button => {
    button.addEventListener("click", () => {
        buttons.forEach(btn => {
            btn.classList.remove("selected","correct","wrong");
        });

        button.classList.add("selected");
        selectedAnswer = button.dataset.answer;
        document.getElementById("feedback").innerHTML = "";
    });
});

function checkAnswer(){
    const feedback = document.getElementById("feedback");

    if(selectedAnswer === ""){
        feedback.innerHTML = "⚠️ اِخْتَرْ إِجَابَةً";
        return;
    }

    buttons.forEach(btn => {
        btn.classList.remove("correct","wrong");
    });

    if(selectedAnswer === "ma"){
        buttons.forEach(btn => {
            if(btn.dataset.answer === "ma"){
                btn.classList.add("correct");
            }
        });
        feedback.innerHTML = "✅ أَحْسَنْتَ";
    }else{
        buttons.forEach(btn => {
            if(btn.dataset.answer === selectedAnswer){
                btn.classList.add("wrong");
            }
        });
        feedback.innerHTML = "❌ حَاوِلْ مَرَّةً أُخْرَى";
    }
}
</script>

</body>
</html>
