<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اِخْتَرِ الحَرَكَةَ</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    padding:10px;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    font-family:'Amiri', serif;
    overflow:hidden;
}

.game-box{
    position:relative;
    width:95%;
    max-width:850px;
    background:#fff2bf;
    border-radius:40px;
    padding:35px 20px;
    text-align:center;
    overflow:hidden;
    box-sizing:border-box;
    margin-top:5px;
}

.shape1{
    position:absolute;
    width:220px;
    height:220px;
    background:#cddc39;
    border-radius:50%;
    bottom:-110px;
    left:-70px;
}

.shape2{
    position:absolute;
    width:280px;
    height:280px;
    background:#ffc400;
    border-radius:50%;
    bottom:-130px;
    right:-90px;
}

.shape3{
    position:absolute;
    width:150px;
    height:150px;
    background:#81d4e8;
    border-radius:50%;
    bottom:-80px;
    right:120px;
}

.shape4{
    position:absolute;
    width:130px;
    height:130px;
    background:#efb0b0;
    border-radius:50%;
    bottom:-60px;
    left:240px;
}

.content{
    position:relative;
    z-index:2;
}

.title{
    font-size:44px;
    color:#e91e63;
    margin-bottom:8px;
    font-weight:bold;
}

.subtitle{
    font-size:34px;
    color:#37a9c5;
    margin-bottom:20px;
    font-weight:bold;
}

.word{
    font-size:72px;
    color:#333;
    margin:15px 0 30px;
    font-family:Arial, sans-serif;
    font-weight:bold;
}

.answers{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.answer-btn{
    background:#f3f3f3;
    border:5px solid #cddc39;
    border-radius:28px;
    padding:12px 30px;
    font-size:34px;
    cursor:pointer;
    transition:0.3s;
    min-width:140px;
    font-family:'Amiri', serif;
    color:#333;
    font-weight:bold;
}

.answer-btn.selected{
    background:#eef7b1;
}

.answer-btn.correct{
    background:#37a9c5;
    color:white;
    border-color:#37a9c5;
}

.answer-btn.wrong{
    background:#ef5350;
    color:white;
    border-color:#d32f2f;
}

.check-btn{
    background:#37a9c5;
    color:white;
    border:none;
    border-radius:35px;
    padding:10px 40px;
    font-size:30px;
    cursor:pointer;
    font-family:'Amiri', serif;
    font-weight:bold;
    margin-top:5px;
}

.feedback{
    margin-top:15px;
    font-size:30px;
    font-weight:bold;
    min-height:35px;
    color:#333;
}

@media(max-width:768px){

    .title{
        font-size:34px;
    }

    .subtitle{
        font-size:24px;
    }

    .word{
        font-size:55px;
    }

    .answer-btn{
        font-size:26px;
        min-width:100px;
        padding:10px 18px;
    }

    .check-btn{
        font-size:24px;
        padding:9px 25px;
    }

    .feedback{
        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="game-box">

    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="shape3"></div>
    <div class="shape4"></div>

    <div class="content">

        <div class="title">
            اِخْتَرِ الحَرَكَةَ
        </div>

        <div class="subtitle">
            اِخْتَرِ الحَرَكَةَ المُنَاسِبَةَ لِهَذِهِ الكَلِمَةِ
        </div>

        <div class="word">
            مَدْرَسَةٌ
        </div>

        <div class="answers">

            <button class="answer-btn" data-answer="ma">
                مَ
            </button>

            <button class="answer-btn" data-answer="mu">
                مُ
            </button>

            <button class="answer-btn" data-answer="mi">
                مِ
            </button>

        </div>

        <button class="check-btn" onclick="checkAnswer()">
            تَحَقَّقْ
        </button>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

let selectedAnswer = "";

const buttons = document.querySelectorAll(".answer-btn");

buttons.forEach(button => {

    button.addEventListener("click", () => {

        buttons.forEach(btn => {
            btn.classList.remove("selected","correct","wrong");
        });

        button.classList.add("selected");

        selectedAnswer = button.dataset.answer;

        document.getElementById("feedback").innerHTML = "";

    });

});

function checkAnswer(){

    const feedback = document.getElementById("feedback");

    if(selectedAnswer === ""){

        feedback.innerHTML = "⚠️ اِخْتَرْ إِجَابَةً";

        return;
    }

    buttons.forEach(btn => {

        btn.classList.remove("correct","wrong");

    });

    if(selectedAnswer === "ma"){

        buttons.forEach(btn => {

            if(btn.dataset.answer === "ma"){

                btn.classList.add("correct");

            }

        });

        feedback.innerHTML = "✅ أَحْسَنْتَ";

    }else{

        buttons.forEach(btn => {

            if(btn.dataset.answer === selectedAnswer){

                btn.classList.add("wrong");

            }

        });

        feedback.innerHTML = "❌ حَاوِلْ مَرَّةً أُخْرَى";

    }
}

</script>

</body>
</html>
