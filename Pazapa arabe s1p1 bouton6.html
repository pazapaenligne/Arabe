<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بازابا — عَمَلٌ رَائِعٌ! / Fin de la séance</title>
<style>


  /* ===================================================================
     Semaine 1 — Seance 1 — Bouton 6 (fin de seance)
     Bouton 3 — Activite 1 — أُسْرَتِي
     Feuille de style de l'identite graphique officielle Pazapa (reprise
     verbatim depuis le Bouton 3 deja valide), limitee aux regles
     reellement utilisees par ce bouton.
     ================================================================= */

  @font-face {
    font-family: "Noto Sans Arabic";
    src: local("Noto Sans Arabic");
    font-display: swap;
  }

  :root {
    --pz-bleu: #36BBD6;
    --pz-bleu-clair: #E4F7FB;
    --pz-vert: #C9D646;
    --pz-vert-clair: #F3F7DD;
    --pz-jaune: #FCC104;
    --pz-jaune-clair: #FFF3D6;
    --pz-rouge: #E6352B;
    --pz-gris-clair: #EBEBEB;
    --pz-gris-fonce: #2E2E2D;
    --pz-blanc: #FFFFFF;
    --rayon: 22px;
    --rayon-btn: 16px;
    --ombre: 0 8px 24px rgba(46, 46, 45, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  /* Aucun centrage plein ecran : chaque page prend naturellement la
     hauteur de son propre contenu (important pour l'iframe Moodle). */
  body {
    font-family: "Noto Sans Arabic", Arial, Tahoma, sans-serif;
    background: linear-gradient(180deg, var(--pz-bleu-clair) 0%, #FAFCF6 55%, var(--pz-vert-clair) 100%);
    color: var(--pz-gris-fonce);
    display: block;
    padding: 10px;
    position: relative;
    overflow-x: hidden;
    letter-spacing: normal;
  }

  /* --- décor : petits carrés/pixels de l'identité Pazapa --- */
  .decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .pixel {
    position: absolute;
    border-radius: 6px;
    opacity: 0;
    animation: pixel-in 0.9s ease-out forwards;
  }

  .pixel:nth-child(1) { inset-inline-start: 6%; top: 10%;  width: 22px; height: 22px; background: var(--pz-jaune); animation-delay: 0.1s; }
  .pixel:nth-child(2) { inset-inline-start: 14%; top: 78%; width: 16px; height: 16px; background: var(--pz-bleu);  animation-delay: 0.25s; }
  .pixel:nth-child(3) { inset-inline-end: 10%;   top: 16%; width: 30px; height: 30px; background: var(--pz-vert);  animation-delay: 0.15s; }
  .pixel:nth-child(4) { inset-inline-end: 18%;   top: 82%; width: 18px; height: 18px; background: var(--pz-jaune); animation-delay: 0.35s; }
  .pixel:nth-child(5) { inset-inline-start: 42%; top: 4%;  width: 14px; height: 14px; background: var(--pz-bleu);  animation-delay: 0.4s;  }
  .pixel:nth-child(6) { inset-inline-end: 42%;   top: 90%; width: 14px; height: 14px; background: var(--pz-vert);  animation-delay: 0.5s;  }

  @keyframes pixel-in {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 0.55; transform: scale(1); }
  }

  .etincelle {
    position: absolute;
    width: 12px;
    height: 12px;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    opacity: 0;
    animation: etincelle-in 1s ease-out forwards, scintiller 3.2s ease-in-out infinite;
  }

  .etincelle:nth-child(7) { inset-inline-start: 24%; top: 30%; width: 10px; height: 10px; background: var(--pz-jaune); animation-delay: 0.6s, 1.6s; }
  .etincelle:nth-child(8) { inset-inline-end: 26%;   top: 68%; width: 9px;  height: 9px;  background: var(--pz-rouge); animation-delay: 0.75s, 2.2s; }
  .etincelle:nth-child(9) { inset-inline-start: 8%;  top: 52%; width: 8px;  height: 8px;  background: var(--pz-vert); animation-delay: 0.9s, 0.8s; }

  @keyframes etincelle-in {
    to { opacity: 0.5; }
  }

  @keyframes scintiller {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.6; }
  }

  /* --- logo officiel Pazapa, dans le flux normal de chaque en-tête --- */
  .logo-slot {
    line-height: 0;
    flex-shrink: 0;
  }

  .logo-img {
    display: block;
    height: 58px;
    width: auto;
  }

  /* --- Page de garde : logo + étiquette flottants + léger centrage.
     Le centrage flex ne force AUCUNE hauteur (pas de 100vh) : sans
     hauteur explicite sur body, il centre seulement horizontalement —
     la page garde sa hauteur naturelle, dépendant uniquement de son
     contenu. --- */
  body.page1-actif {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 130px 24px 24px;
  }

  body.page1-actif main {
    max-width: 460px;
  }

  .logo-page1-flottant {
    display: none;
    position: absolute;
    top: 24px;
    inset-inline-start: 24px;
    z-index: 2;
    line-height: 0;
  }

  body.page1-actif .logo-page1-flottant {
    display: block;
  }

  .logo-page1-flottant .logo-img {
    height: 30px;
    width: auto;
  }

  .etiquette-page1-flottant {
    display: none;
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 2;
  }

  body.page1-actif .etiquette-page1-flottant {
    display: block;
  }

  /* --- en-tête compact : logo + étiquette semaine/séance --- */
  .entete-compact {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 10px;
    padding: 14px 20px;
    border-radius: var(--rayon-btn);
    background: linear-gradient(180deg, var(--pz-bleu-clair) 0%, var(--pz-vert-clair) 100%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
  }

  .carte {
    background: var(--pz-blanc);
    border-radius: var(--rayon);
    box-shadow: var(--ombre);
    padding: 16px 32px;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: carte-in 0.6s ease-out 0.2s forwards;
  }

  @keyframes carte-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- pages supplémentaires du même bouton, masquées par défaut --- */
  .page-masquee {
    display: none;
  }

  main .carte + .carte {
    margin-top: 14px;
  }

  /* --- Navigation interne (Suivant / Précédent) --------------------
     La navigation ne doit jamais concurrencer visuellement l'exercice :
     pas de grosse ombre, largeur réduite au nécessaire, zone tactile
     >= 44px, placée juste sous l'activité (pas de margin-top:auto,
     pas de position:fixed, pas de 100vh). --- */
  .barre-navigation {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 0;
  }

  .bouton-nav {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    min-width: 44px;
    padding: 8px 16px;
    margin: 0;
    max-width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    background: var(--pz-bleu);
    border: 1.5px solid var(--pz-bleu);
    border-radius: 10px;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .bouton-nav .ligne-ar {
    color: var(--pz-blanc);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    line-height: 1.3;
  }

  .bouton-nav .ligne-fr {
    color: rgba(255, 255, 255, 0.92);
    font-size: 18px;
    margin: 0;
    line-height: 1.2;
  }

  .bouton-nav:hover {
    background: #2CA6BF;
  }

  .bouton-nav:active {
    transform: scale(0.97);
  }

  .bouton-nav:focus-visible {
    outline: 3px solid var(--pz-gris-fonce);
    outline-offset: 2px;
  }

  .bouton-nav--retour {
    background: var(--pz-blanc);
    border: 1.5px solid var(--pz-bleu);
    box-shadow: none;
  }

  .bouton-nav--retour .ligne-ar {
    color: var(--pz-bleu);
  }

  .bouton-nav--retour .ligne-fr {
    color: var(--pz-bleu);
    opacity: 0.85;
  }

  .bouton-nav--retour:hover {
    background: var(--pz-bleu-clair);
  }

  .bouton-nav--compact {
    padding: 8px 16px;
  }

  /* --- Feedback uniformisé (réussite / erreur), utilisé sur la page 2 --- */
  .message-feedback-activite {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    max-width: 460px;
    margin: 14px auto 0;
    padding: 10px 18px;
    border-radius: var(--rayon-btn);
    text-align: center;
    opacity: 0;
    transform: translateY(6px) scale(0.97);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .message-feedback-activite.message-feedback--visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .message-feedback-activite--erreur {
    background: #FBE7E5;
    border: 2px solid var(--pz-rouge);
  }

  .message-feedback-activite--reussite {
    background: var(--pz-vert-clair);
    border: 2px solid var(--pz-vert);
  }

  .message-feedback-activite .message-feedback-ar {
    font-family: "Noto Sans Arabic", Arial, Tahoma, sans-serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.7;
    color: var(--pz-gris-fonce);
  }

  .message-feedback-activite .message-feedback-fr {
    font-size: 20px;
    color: var(--pz-gris-fonce);
  }

  .etiquette {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    background: var(--pz-vert-clair);
    padding: 7px 18px;
    border-radius: 999px;
    margin-block-end: 0;
  }

  .etiquette-ar {
    font-weight: 700;
    font-size: 0.82rem;
    color: #5C6B12;
  }

  .etiquette-fr {
    font-weight: 500;
    font-size: 0.8rem;
    color: #6C7A3E;
  }

  h1 {
    margin: 0 0 12px;
  }

  h1 + .ligne-bilingue {
    margin-top: 14px;
    margin-bottom: 8px;
  }

  .titre-ar {
    display: block;
    font-size: 35px;
    line-height: 1.7;
    font-weight: 800;
    color: var(--pz-gris-fonce);
  }

  .titre-fr {
    display: block;
    font-size: 21.5px;
    line-height: 1.4;
    font-weight: 600;
    color: #57574F;
    margin-top: 4px;
  }

  /* --- lignes bilingues : arabe dominant, français juste en dessous --- */
  .ligne-bilingue {
    margin: 0 0 14px;
  }

  .ligne-bilingue:last-child {
    margin-bottom: 0;
  }

  .ligne-ar {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.7;
    color: var(--pz-gris-fonce);
    margin: 0;
  }

  .ligne-ar strong {
    color: var(--pz-bleu);
  }

  .ligne-fr {
    font-size: 19.5px;
    font-weight: 500;
    line-height: 1.5;
    color: #57574F;
    margin: 4px 0 0;
  }

  .ligne-bilingue--accent .ligne-ar {
    color: var(--pz-bleu);
  }

  /* --- Page de clôture --- */
  .carte-fin .contenu-fin {
    text-align: center;
    padding: 18px 8px 6px;
  }

  .carte-fin .etoile-fin {
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 10px;
  }

  .carte-fin .titre-ar {
    font-size: 35px;
    color: var(--pz-bleu);
    text-align: center;
  }

  .carte-fin .titre-fr {
    font-size: 21.5px;
    text-align: center;
    margin-top: 6px;
  }

  .carte-fin .ligne-fin {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
    margin-top: 22px;
  }

  .carte-fin .ligne-fin .ligne-ar {
    text-align: center;
  }

  .carte-fin .ligne-fin .ligne-fr {
    text-align: center;
  }

  .carte-fin .ligne-fin:last-of-type .ligne-ar {
    color: var(--pz-vert);
  }

  .carte-fin .barre-navigation {
    justify-content: center;
    margin-top: 26px;
  }

  .bouton-recommencer-tout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-direction: column;
    min-height: 44px;
    padding: 12px 32px;
    border: none;
    border-radius: 999px;
    background: var(--pz-bleu);
    color: var(--pz-blanc);
    cursor: pointer;
    box-shadow: 0 4px 0 #279BB5;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .bouton-recommencer-tout:hover {
    transform: translateY(-1px);
  }

  .bouton-recommencer-tout:active {
    transform: scale(0.97);
    box-shadow: 0 2px 0 #279BB5;
  }

  .bouton-recommencer-tout .ligne-ar {
    color: var(--pz-blanc);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .bouton-recommencer-tout .ligne-fr {
    color: rgba(255, 255, 255, 0.92);
    font-size: 18px;
    margin: 0;
  }

  /* --- responsive --- */
  @media (max-width: 768px) {
    .carte {
      padding: 18px 16px;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 10px;
    }
  }

  @media (max-width: 480px) {
    .etiquette-page1-flottant {
      top: 62px;
    }
    .carte {
      padding: 14px 12px;
      border-radius: 18px;
    }
    .pixel {
      transform: scale(0.7);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .pixel,
    .carte {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .etincelle {
      animation: none !important;
      opacity: 0.35 !important;
    }
  }

  /* --- Page de garde : mascotte Pazapa (ressource officielle reprise
     telle quelle du gabarit, non modifiee) --- */
  .bloc-mascotte-accueil {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    margin: 10px 0 18px;
  }

  .mascotte-img {
    flex-shrink: 0;
    max-width: 110px;
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 0 10px;
    opacity: 0;
    transform: translateY(8px) scale(0.94);
    animation: mascotte-in 0.6s ease-out 0.15s forwards;
  }

  @keyframes mascotte-in {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bloc-mascotte-accueil .bloc-texte-accueil {
    min-width: 0;
    text-align: center;
  }

  @media (max-width: 480px) {
    .mascotte-img {
      max-width: 80px;
    }
  }

  /* --- Bouton de démarrage "C'est parti !" : plus visible qu'un
     bouton-nav standard, sans pour autant devenir un gros bloc rouge --- */
  .bouton-demarrer {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-direction: column;
    min-height: 48px;
    padding: 14px 36px;
    border: none;
    border-radius: 999px;
    background: var(--pz-bleu);
    color: var(--pz-blanc);
    cursor: pointer;
    box-shadow: 0 4px 0 #279BB5;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .bouton-demarrer:hover { transform: translateY(-1px); }
  .bouton-demarrer:active { transform: scale(0.97); box-shadow: 0 2px 0 #279BB5; }
  .bouton-demarrer .ligne-ar {
    color: var(--pz-blanc);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }
  .bouton-demarrer .ligne-fr {
    color: rgba(255,255,255,0.92);
    font-size: 18px;
    margin: 0;
  }



  /* ===================================================================
     LECTURE AUDIO DES MOTS ARABES CLIQUABLES (effet visuel discret,
     partage par toutes les activites concernees). N'ecrase jamais un
     etat pedagogique deja fixe (vert = reussite, rouge = erreur) : la
     classe n'est ajoutee par le script que lorsque le bouton n'est pas
     deja dans un tel etat.
     =================================================================== */
  .audio-en-cours {
    border-color: var(--pz-bleu) !important;
    background: var(--pz-bleu-clair) !important;
  }

  /* ===================================================================
     TEXTES DIRECTEMENT CLIQUABLES POUR L'AUDIO (consignes de chaque
     activite, question de l'Activite 4) : remplace les anciens boutons
     visuels "🔊 اِسْتَمِعْ" par un simple clic sur le texte lui-meme.
     Aucun nouveau bouton, juste un curseur et un effet tres discret.
     =================================================================== */
  .b3-texte-audio {
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.15s ease;
  }
  .b3-texte-audio:active { transform: scale(0.99); }
  .b3-texte-audio:focus-visible {
    outline: 3px solid var(--pz-gris-fonce);
    outline-offset: 2px;
  }

  /* ===================================================================
     AJOUTS SPECIFIQUES A CETTE ACTIVITE (Semaine 1, Seance 2, Bouton 3,
     Activite 1 -- أُسْرَتِي). Classes scopees, prefixe .b3-fam-, sans
     aucune regle globale. Couleurs reprises telles quelles de la charte
     (pz-bleu = selection active, pz-vert = reussite, pz-rouge = erreur),
     comme le fait deja .b3-outil[aria-pressed] pour la boite a outils du
     Bouton 3 - Seance 1. Aucune nouvelle couleur n'est introduite.
     =================================================================== */

  .b3-fam-wrap {
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 760px;
    margin: 4px auto 6px;
  }

  .b3-fam-images,
  .b3-fam-mots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    justify-items: center;
  }

  .b3-fam-image {
    width: 100%;
    max-width: 140px;
    aspect-ratio: 1 / 1;
    padding: 8px;
    background: #FBFBFA;
    border: 3px solid #E3E3E1;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .b3-fam-image:hover { border-color: var(--pz-bleu); }
  .b3-fam-image:active { transform: scale(0.97); }
  .b3-fam-image:focus-visible { outline: 3px solid var(--pz-gris-fonce); outline-offset: 2px; }

  .b3-fam-image.selectionnee {
    border-color: var(--pz-bleu);
    background: var(--pz-bleu-clair);
  }

  .b3-fam-image.associee {
    border-color: var(--pz-vert);
    background: var(--pz-vert-clair);
    cursor: default;
    opacity: 0.85;
  }

  .b3-fam-image.erreur-momentanee {
    border-color: var(--pz-rouge);
    animation: b3-fam-secousse 0.35s ease;
  }

  @keyframes b3-fam-secousse {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .b3-fam-mot {
    width: 100%;
    max-width: 140px;
    min-height: 52px;
    padding: 10px 12px;
    background: var(--pz-blanc);
    border: 3px solid #E3E3E1;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    color: var(--pz-gris-fonce);
    line-height: 1.5;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .b3-fam-mot:hover { border-color: var(--pz-bleu); }
  .b3-fam-mot:active { transform: scale(0.97); }
  .b3-fam-mot:focus-visible { outline: 3px solid var(--pz-gris-fonce); outline-offset: 2px; }

  .b3-fam-mot.selectionnee {
    border-color: var(--pz-bleu);
    background: var(--pz-bleu-clair);
  }

  .b3-fam-mot.associee {
    border-color: var(--pz-vert);
    background: var(--pz-vert-clair);
    color: #3D4406;
    cursor: default;
    opacity: 0.85;
  }

  .b3-fam-mot.erreur-momentanee {
    border-color: var(--pz-rouge);
    animation: b3-fam-secousse 0.35s ease;
  }

  @media (max-width: 600px) {
    .b3-fam-images, .b3-fam-mots { grid-template-columns: repeat(2, 1fr); }
  }

  /* --- Les 2 encarts de feedback de cette activite (#msg-reussite,
     #msg-erreur) restent superposes dans le flux normal de la
     charte (aucun display:none, seulement opacity/transform, comme dans
     le modele valide) : quand aucun n'est visible, leur espace reserve
     s'additionne et cree un grand vide avant la navigation. On reduit
     cet espace ici, sans toucher aux couleurs ni au texte des feedbacks,
     en repliant uniquement la hauteur des encarts masques. ------------- */
  #msg-reussite, #msg-erreur {

  /* ===================================================================
     HABILLAGE VISUEL DE L'ACTIVITE 1 UNIQUEMENT (Semaine 1, Seance 2,
     Bouton 3). Renforce la presence PAZAPA de carte-a1 avec des teintes
     TRES CLAIRES de la charte existante -- aucune nouvelle couleur,
     aucun changement de structure, de JavaScript ni de dimensions.
     Tout est scope via #carte-a1 pour ne jamais affecter carte-a2 (qui
     partage certaines classes generiques comme .ligne-bilingue--accent
     ou .bouton-audio-consigne) ni la page de garde.
     =================================================================== */

  #carte-a1 .ligne-bilingue--accent {

  #carte-a1 .bouton-audio-consigne {

  #carte-a1 .bouton-audio-consigne:active { transform: scale(0.97); }

  #carte-a1 .b3-fam-wrap {

    border: 1px solid rgba(54,187,214,0.18);
    border-radius: 24px;
  }

  /* --- 2. Cartes images : meme fond clair uniforme pour toutes + un peu
     plus de vie (ombre douce, SVG legerement agrandi) --- */

    padding: 6px;

  #carte-a1 .b3-fam-image.selectionnee { background: var(--pz-bleu-clair); }
  #carte-a1 .b3-fam-image.associee { background: var(--pz-vert-clair); }

    background: rgba(54,187,214,0.10);

  /* ===================================================================
     MASCOTTE PAZ SUR LA PAGE DE FIN (carte-fin). Ajout uniquement visuel,
     ne modifie aucune regle existante de .carte-fin / .contenu-fin /
     .etoile-fin deja validees dans la charte commune.
     =================================================================== */
  .mascotte-fin {
    display: block;
    max-width: 120px;
    width: 100%;
    height: auto;
    margin: 0 auto 4px;
  }
  @media (max-width: 480px) {
    .mascotte-fin { max-width: 100px; }
  }

  /* ===================================================================
     PETITE BULLE DE PAROLE DECORATIVE A COTE DE PAZ (page de fin). Purement
     visuelle (aria-hidden), ne deplace ni Paz ni le reste du contenu :
     positionnee en absolu au-dessus du flux, dans un wrapper qui se
     contente d'entourer la mascotte a sa taille reelle (aucun changement
     de mise en page, de couleurs ou de contenu existant). ----
     =================================================================== */
  .mascotte-fin-ligne {
    text-align: center;
  }
  .mascotte-fin-wrap {
    position: relative;
    display: inline-block;
  }
  .bulle-paz {
    position: absolute;
    top: -14px;
    right: -34px;
    max-width: 130px;
    background: #FFFFFF;
    border: 1.5px solid #36BBD6;
    border-radius: 16px;
    padding: 6px 13px;
    box-shadow: 0 2px 6px rgba(46,46,45,0.10);
    line-height: 1.25;
    white-space: nowrap;
    pointer-events: none;
  }
  .bulle-paz span {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: #36BBD6;
    text-align: center;
  }
  .bulle-paz::after,
  .bulle-paz::before {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
  }
  .bulle-paz::after {
    bottom: -8px;
    left: 24px;
    border-top: 8px solid #36BBD6;
  }
  .bulle-paz::before {
    bottom: -5.5px;
    left: 25.5px;
    border-left-width: 5.5px;
    border-right-width: 5.5px;
    border-top: 6px solid #FFFFFF;
  }

  @media (max-width: 600px) {
    .bulle-paz {
      top: -10px;
      right: -16px;
      max-width: 108px;
      padding: 5px 10px;
    }
    .bulle-paz span { font-size: 13px; }
  }

  @media (max-width: 480px) {
    .bulle-paz {
      top: -8px;
      right: -6px;
      max-width: 92px;
      padding: 4px 9px;
    }
    .bulle-paz span { font-size: 12px; }
  }

  /* ===================================================================
     IMAGE OFFICIELLE DE PAZ SUR LA PAGE DE GARDE (carte-garde) : cette
     image contient deja Paz ET sa bulle "هَيَّا نَتَدَرَّبْ" integrees au
     visuel (aucune bulle HTML separee). Sa composition est plus large
     que l'ancienne mascotte seule, donc une largeur plus grande est

  /* ===================================================================
     PETIT INDICE VISUEL "HAUT-PARLEUR" SUR LES ELEMENTS SONORES.
     Purement decoratif (aria-hidden) : le clic continue de se faire sur
     tout l'element (mot / image / question), aucun listener separe n'est
     attache au badge lui-meme. Couleurs reprises telles quelles de la
     charte (#36BBD6 / #E4F7FB), meme badge pour tous les types
     d'elements concernes afin de rester previsible pour l'enfant.
     =================================================================== */
  .b3-fam-mot,
  .b3-pos-btn,
  .b3-vis-image,
  .b3-ecoute-choix {
    position: relative;
  }

  /* Conteneurs-image sonores : le badge doit toujours rester DANS le
     cadre de la carte, jamais deborder par-dessus le bord. */
  .b3-vis-image,
  .b3-ecoute-choix {
    overflow: hidden;
  }

  /* Zone porteuse : 44x44 px, totalement invisible (pas de fond, pas de
     bordure, pas d'ombre). Le clic reel est toujours gere par la carte /
     le bouton entier qui la contient (deja bien plus grand que 44x44 sur
     toutes les activites) : cette zone et son cercle ne recoivent eux-
     memes aucun evenement (pointer-events: none). Elle sert uniquement a
     reserver visuellement la place autour du petit cercle audio, pour
     qu'un futur ajustement reste sans risque sur la cible tactile. */
  .badge-audio {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    box-shadow: none;
    pointer-events: none;
  }

  /* Seul element reellement visible : petit cercle de 15x15 px, centre
     dans la zone ci-dessus -- se retrouve donc a ~5px du coin superieur
     droit de la carte (au ras du coin, pour ne plus recouvrir le sujet
     de l'illustration : casque, dome, porte, bouteille, coq, tigre...). */
  .badge-audio-cercle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(54,187,214,0.75);
    box-shadow: none;
  }

  .badge-audio-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 1.5px solid #36BBD6;
    box-shadow: none;
    vertical-align: middle;
    margin-inline-end: 8px;
    flex-shrink: 0;
    pointer-events: none;
  }

  .badge-audio-icone {
    display: block;
    width: 8px;
    height: 8px;
    pointer-events: none;
  }

  .badge-audio-inline .badge-audio-icone {
    width: 16px;
    height: 16px;
  }

  /* Renforcement tres leger du bleu au survol (ordinateur uniquement) et
     au clic -- aucune animation continue, juste un retour discret sur
     l'etat deja gere par le bouton porteur. */
  .b3-fam-mot:hover .badge-audio-cercle,
  .b3-fam-mot:focus-visible .badge-audio-cercle,
  .b3-pos-btn:hover .badge-audio-cercle,
  .b3-pos-btn:focus-visible .badge-audio-cercle,
  .b3-vis-image:hover .badge-audio-cercle,
  .b3-vis-image:focus-visible .badge-audio-cercle,
  .b3-ecoute-choix:hover .badge-audio-cercle,
  .b3-ecoute-choix:focus-visible .badge-audio-cercle,
  .b3-texte-audio:hover .badge-audio-inline,
  .b3-texte-audio:focus-visible .badge-audio-inline {
    border-color: #1F92AC;
    background: #EAF7FB;
  }

  /* Tablette : le cercle audio des propositions garde EXACTEMENT sa
     taille visuelle (15x15 px) -- seul le bouton audio de la question
     (badge-audio-inline) suit encore le responsive existant. */
  @media (max-width: 600px) {
    .badge-audio-inline {
      width: 32px;
      height: 32px;
    }
    .badge-audio-inline .badge-audio-icone {
      width: 15px;
      height: 15px;
    }
  }

  /* Mobile : idem, le cercle des propositions reste fixe a 15x15 px. */
  @media (max-width: 480px) {
    .badge-audio-inline {
      width: 28px;
      height: 28px;
    }
    .badge-audio-inline .badge-audio-icone {
      width: 13px;
      height: 13px;
    }
  }

  /* ===================================================================
     AJOUTS SPECIFIQUES AU BOUTON 5 (Semaine 1, Seance 2 -- test des
     connaissances). Classes scopees, prefixe .b5-, sans regle globale.
     Reprend telles quelles les classes generiques du modele (b3-pos-*,
     b3-vis-*, b3-ecoute-*, b3-texte-audio, bouton-nav,
     message-feedback-activite...) pour la consigne, les cartes-images,
     les boutons de reponse, les feedbacks et la navigation : seule la
     mise en page du sujet et le conteneur de question sont propres a
     ce bouton.
     =================================================================== */

  .b5-question {
    font-size: 30px;
    font-weight: 700;
    color: var(--pz-gris-fonce);
    text-align: center;
    margin: 0 0 4px;
  }

  .b5-mot-cle {
    display: inline-flex;
    align-items: center;
    font-size: 34px;
    font-weight: 800;
    color: var(--pz-bleu);
    margin: 6px 0 4px;
  }

  .b5-sujet {
    display: flex;
    justify-content: center;
    margin: 6px 0 4px;
  }

  .b5-sujet-photo {
    height: 150px;
    width: auto;
    max-width: 260px;
    display: block;
  }

  .b5-deux-images {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    margin-top: 6px;
  }

  .b5-progression {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 2px 0 4px;
  }

  @media (max-width: 600px) {
    .b5-question { font-size: 26px; }
    .b5-mot-cle { font-size: 28px; }
    .b5-sujet-photo { height: 110px; max-width: 190px; }
  }


  /* ===================================================================
     CONFETTIS DE FELICITATION FINALE (Bouton 5). Purement decoratifs
     (aria-hidden, pointer-events:none) : ne bloquent aucun bouton, ne
     masquent pas durablement Paz ni le texte (~2s puis disparition).
     Aucun score, aucun point : felicitation visuelle uniquement.
     Ajout scope a #carte-fin, sans toucher au reste de la charte.
     =================================================================== */
  #carte-fin { position: relative; }
  #b5-confetti-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    max-height: 260px;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
  }
  .b5-confetti {
    position: absolute;
    top: -12px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: b5-confetti-chute;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes b5-confetti-chute {
    to { transform: translateY(230px) rotate(300deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #b5-confetti-layer { display: none; }
  }

  /* ===================================================================
     Page d'ouverture du Bouton 5 -- nouveau modele officiel (Semaine 1,
     Seance 2). Petit encadre bilingue d'introduction : purement visuel,
     aucun audio associe. Scope a #carte-garde, prefixe .b5-, sans regle
     globale. Reprend les teintes tres claires deja de la charte
     (--pz-bleu-clair) ; aucune nouvelle couleur n'est introduite.
     =================================================================== */
  #carte-garde .b5-encadre-garde {
    display: inline-block;
    max-width: 320px;
    margin: 0 auto 16px;
    padding: 10px 22px;
    border-radius: 20px;
    background: var(--pz-bleu-clair);
  }
  #carte-garde .b5-encadre-garde .ligne-ar {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--pz-gris-fonce);
    margin: 0 0 4px;
  }
  #carte-garde .b5-encadre-garde .ligne-fr {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
    color: #57574F;
    margin: 0;
  }
  @media (max-width: 480px) {
    #carte-garde .b5-encadre-garde {
      max-width: 260px;
      padding: 8px 16px;
      margin: 0 auto 12px;
    }
    #carte-garde .b5-encadre-garde .ligne-ar { font-size: 17px; }
    #carte-garde .b5-encadre-garde .ligne-fr { font-size: 14px; }
  }
  

  /* ===================================================================
     Bouton 6 -- FIN DE LA SEANCE (Semaine 1, Seance 2). Page de cloture
     uniquement, sans exercice ni audio. Classes scopees, prefixe .b6-,
     sans regle globale. Reprend telles quelles les classes generiques
     de la charte commune (entete-compact, etiquette*, titre-ar/fr,
     ligne-bilingue, ligne-ar/fr) ; aucune nouvelle couleur.
     =================================================================== */
  /* Rangee Paz + messages : Paz a droite, les deux bulles de message
     a sa gauche, l'ensemble centre verticalement sur sa hauteur. */
  .b6-ligne-mascotte-messages {
    display: flex;
    direction: ltr;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 10px 0 10px;
  }
  .b6-messages-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 300px;
  }
  .b6-mascotte-conteneur {
    width: 150px;
    max-width: 150px;
    flex: 0 0 auto;
    margin: 0;
  }
  .b6-mascotte-img {
    display: inline-block;
    max-width: 150px;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
  @media (max-width: 560px) {
    .b6-ligne-mascotte-messages {
      flex-direction: column-reverse;
      direction: rtl;
      gap: 10px;
    }
    .b6-messages-col {
      max-width: 100%;
      width: 100%;
    }
    .b6-mascotte-img {
      max-width: 120px;
    }
    .b6-mascotte-conteneur {
      width: 120px;
      max-width: 120px;
    }
  }

  /* --- Felicitation principale : sortir du noir-sur-blanc --- */
  #carte-fin-seance h1 {
    margin: 0 0 4px;
  }
  #carte-fin-seance h1 .titre-ar {
    color: var(--pz-bleu);
  }
  #carte-fin-seance h1 .titre-fr {
    color: #6B6B62;
  }

  /* --- Mascotte : resserree pour rapprocher les encadres --- */
  #carte-fin-seance .b6-ligne-mascotte-messages {
    margin: 4px 0 8px;
  }

  /* --- Deux encadres doux de cloture, couleurs PAZAPA en accent --- */
  #carte-fin-seance .b6-encadre {
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
    margin-top: 0;
    padding: 12px 16px;
    border-radius: 20px;
    text-align: center;
  }
  #carte-fin-seance .b6-encadre .ligne-ar {
    color: var(--pz-bleu);
    font-size: 23px;
    line-height: 1.5;
    margin: 0 0 4px;
  }
  #carte-fin-seance .b6-encadre .ligne-fr {
    color: var(--pz-gris-fonce);
    font-size: 16.5px;
    margin: 0;
  }
  #carte-fin-seance .b6-encadre--bleu {
    background: var(--pz-bleu-clair);
    margin-bottom: 0;
  }
  #carte-fin-seance .b6-encadre--jaune {
    background: var(--pz-jaune-clair);
    margin-bottom: 0;
  }

  /* ===================================================================
     Bouton 6 -- celebration de fin de seance : apparition progressive
     + etincelles/confettis ponctuels autour de Paz. Tout est scope au
     prefixe .b6-, aucune regle globale. Par defaut (sans preference de
     mouvement reduit exprimee), le contenu est deja visible dans son
     etat final ; l'animation est une amelioration progressive ajoutee
     uniquement sous @media (prefers-reduced-motion: no-preference), et
     elle ne se rejoue jamais (fill-mode forwards, pas d'iteration).
     =================================================================== */
  .b6-mascotte-conteneur {
    position: relative;
  }
  .b6-sparkle {
    display: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    #carte-fin-seance h1,
    #carte-fin-seance .b6-ligne-mascotte-messages {
      opacity: 0;
      animation: b6-entree 0.55s ease-out forwards;
    }
    #carte-fin-seance h1 { animation-delay: 0.05s; }
    #carte-fin-seance .b6-ligne-mascotte-messages { animation-delay: 0.35s; }

    #carte-fin-seance .b6-mascotte-img {
      animation: b6-paz-rebond 0.7s ease-out 0.35s both;
    }

    .b6-sparkle {
      display: block;
      position: absolute;
      font-size: 26px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      animation: b6-etincelle 1.3s ease-out forwards;
    }
    .b6-sparkle--1 { top: -6px;  left: 6%;   animation-delay: 0.55s; }
    .b6-sparkle--2 { top: 4px;   right: 4%;  animation-delay: 0.75s; font-size: 22px; }
    .b6-sparkle--3 { bottom: 6%; left: -2%;  animation-delay: 0.95s; font-size: 20px; }

  }

  @keyframes b6-entree {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes b6-paz-rebond {
    0%   { transform: translateY(6px) scale(0.96); }
    55%  { transform: translateY(-6px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes b6-etincelle {
    0%   { opacity: 0; transform: scale(0.5) rotate(-8deg); }
    35%  { opacity: 1; transform: scale(1.1) rotate(4deg); }
    75%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(0.9) rotate(0deg); }
  }
  /* ===================================================================
     Confettis de la celebration finale (Bouton 6) : generes en JS (voir
     jouerConfettisB6), 30 a 50 pieces, formes variees, couleurs PAZAPA.
     Le calque est absolu et confine au haut/centre de la carte (titre +
     mascotte), overflow:hidden pour ne jamais agrandir la page ni creer
     de scroll, pointer-events:none pour ne bloquer aucun clic. Purement
     decoratif (aria-hidden), une seule fois, puis retire du DOM.
     =================================================================== */
  #carte-fin-seance { position: relative; }
  #b6-confetti-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    max-height: 300px;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
  }
  .b6-confetti-piece {
    position: absolute;
    top: -14px;
    opacity: 0.95;
    animation-name: b6-confetti-chute;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  .b6-confetti-piece--rect  { width: 8px; height: 14px; border-radius: 2px; }
  .b6-confetti-piece--rond  { width: 9px; height: 9px; border-radius: 50%; }
  .b6-confetti-piece--etoile {
    width: 12px;
    height: 12px;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  @keyframes b6-confetti-chute {
    to { transform: translateY(270px) rotate(320deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #b6-confetti-layer { display: none; }
  }

  @media (max-width: 480px) {
    #carte-fin-seance .b6-encadre {
      padding: 11px 16px;
      border-radius: 18px;
    }
    #carte-fin-seance .b6-encadre .ligne-ar {
      font-size: 20px;
    }
    #carte-fin-seance .b6-encadre .ligne-fr {
      font-size: 15px;
    }
  }

</style>

  if (!audio) { return; }

  var audioDemarre = false;
  var tentativeEnCours = false;
  var EVENEMENTS_SECOURS = ["pointerdown", "touchstart", "click", "keydown"];

  function retirerEcouteursSecours() {
    EVENEMENTS_SECOURS.forEach(function (evt) {
      document.removeEventListener(evt, tenterLectureAudio, true);
    });
  }

  // Des que la lecture demarre reellement (evenement natif "play"), on
  // considere l'audio comme lance : plus aucune tentative automatique
  // n'est permise, et les ecouteurs de secours temporaires sont retires.
  audio.addEventListener("play", function () {
    audioDemarre = true;
    tentativeEnCours = false;
    retirerEcouteursSecours();
  });

  function tenterLectureAudio() {
    if (audioDemarre) { return; }
    if (tentativeEnCours) { return; }
    tentativeEnCours = true;
    try {
      audio.currentTime = 0;
      var p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(function () { tentativeEnCours = false; });
      }
    } catch (e) {
      tentativeEnCours = false;
    }
  }

  // Filet de secours invisible (aucun bouton, aucune interface, rien de
  // specifique a Paz) : si l'autoplay a ete bloque par le navigateur,
  // chaque interaction generale de l'enfant avec la page - ou qu'elle
  // soit, sans qu'on la lui demande - retente silencieusement la meme
  // lecture, jusqu'a ce qu'elle demarre reellement (voir ci-dessus).
  EVENEMENTS_SECOURS.forEach(function (evt) {
    document.addEventListener(evt, tenterLectureAudio, { capture: true, passive: true });
  });

  // ===================================================================
  // Confettis de la celebration finale : generes une seule fois, en
  // meme temps que la tentative de lecture audio (voir appels ci-
  // dessous), autour du haut/centre de la carte. ~40 pieces (rectangles,
  // ronds, etoiles) aux couleurs PAZAPA, chute courte (~2-2.6s) puis
  // retrait complet du DOM. Purement decoratif, ne bloque aucun clic.
  // ===================================================================
  var COULEURS_CONFETTI_B6 = ["#36BBD6", "#FCC104", "#F6A96B", "#F4A9C8"];
  var FORMES_CONFETTI_B6 = ["b6-confetti-piece--rect", "b6-confetti-piece--rond", "b6-confetti-piece--etoile"];

  function jouerConfettisB6() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
    var carte = document.getElementById("carte-fin-seance");
    if (!carte) { return; }
    var couche = document.createElement("div");
    couche.id = "b6-confetti-layer";
    couche.setAttribute("aria-hidden", "true");
    carte.insertBefore(couche, carte.firstChild);
    var total = 40;
    for (var i = 0; i < total; i++) {
      var piece = document.createElement("span");
      piece.className = "b6-confetti-piece " + FORMES_CONFETTI_B6[i % FORMES_CONFETTI_B6.length];
      piece.style.left = (Math.random() * 96 + 2) + "%";
      piece.style.background = COULEURS_CONFETTI_B6[i % COULEURS_CONFETTI_B6.length];
      piece.style.animationDuration = (1.8 + Math.random() * 0.8) + "s";
      piece.style.animationDelay = (Math.random() * 0.25) + "s";
      couche.appendChild(piece);
    }
    setTimeout(function () { couche.remove(); }, 2900);
  }

  // Arrivee sur la page finale : audio et confettis demarrent ensemble,
  // sans attendre l'un ou l'autre.
  tenterLectureAudio();
  jouerConfettisB6();
})();
</script>
</html>
