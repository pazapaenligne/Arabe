<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بازابا — هَيَّا نَبْدَأْ</title>
<style>
  @font-face {
    font-family: "Noto Sans Arabic";
    src: local("Noto Sans Arabic");
    font-display: swap;
  }

  :root {
    --pz-bleu: #36BBD6;
    --pz-bleu-clair: #E4F7FB;
    --pz-vert: #C9D646;
    --pz-vert-clair: #F3F7DD;
    --pz-jaune: #FCC104;
    --pz-jaune-clair: #FFF3D6;
    --pz-rouge: #E6352B;
    --pz-gris-clair: #EBEBEB;
    --pz-gris-fonce: #2E2E2D;
    --pz-blanc: #FFFFFF;
    --rayon: 22px;
    --rayon-btn: 16px;
    --ombre: 0 8px 24px rgba(46, 46, 45, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: "Noto Sans Arabic", Arial, Tahoma, sans-serif;
    background: linear-gradient(180deg, var(--pz-bleu-clair) 0%, #FAFCF6 55%, var(--pz-vert-clair) 100%);
    color: var(--pz-gris-fonce);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    letter-spacing: normal;
  }

  /* --- décor : petits carrés/pixels de l'identité Pazapa --- */
  .decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .pixel {
    position: absolute;
    border-radius: 6px;
    opacity: 0;
    animation: pixel-in 0.9s ease-out forwards;
  }

  .pixel:nth-child(1) { inset-inline-start: 6%; top: 10%;  width: 22px; height: 22px; background: var(--pz-jaune); animation-delay: 0.1s; }
  .pixel:nth-child(2) { inset-inline-start: 14%; top: 78%; width: 16px; height: 16px; background: var(--pz-bleu);  animation-delay: 0.25s; }
  .pixel:nth-child(3) { inset-inline-end: 10%;   top: 16%; width: 30px; height: 30px; background: var(--pz-vert);  animation-delay: 0.15s; }
  .pixel:nth-child(4) { inset-inline-end: 18%;   top: 82%; width: 18px; height: 18px; background: var(--pz-jaune); animation-delay: 0.35s; }
  .pixel:nth-child(5) { inset-inline-start: 42%; top: 4%;  width: 14px; height: 14px; background: var(--pz-bleu);  animation-delay: 0.4s;  }
  .pixel:nth-child(6) { inset-inline-end: 42%;   top: 90%; width: 14px; height: 14px; background: var(--pz-vert);  animation-delay: 0.5s;  }

  @keyframes pixel-in {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 0.55; transform: scale(1); }
  }

  /* --- logo officiel Pazapa (fichier fourni, non modifié) --- */
  .logo-slot {
    position: absolute;
    top: 24px;
    inset-inline-start: 24px;
    z-index: 2;
    line-height: 0;
  }

  .logo-img {
    display: block;
    height: 30px;
    width: auto;
    /* proportions d'origine conservées : aucune déformation */
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
  }

  .carte {
    background: var(--pz-blanc);
    border-radius: var(--rayon);
    box-shadow: var(--ombre);
    padding: 40px 32px;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: carte-in 0.6s ease-out 0.2s forwards;
  }

  @keyframes carte-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .etiquette {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pz-vert-clair);
    color: #5C6B12;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 16px;
    border-radius: 999px;
    margin-block-end: 18px;
  }

  .etiquette .noeud {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--pz-vert);
    flex-shrink: 0;
  }

  h1 {
    margin: 0 0 14px;
  }

  .titre-ar {
    display: block;
    font-size: 1.9rem;
    line-height: 1.4;
    font-weight: 800;
    color: var(--pz-gris-fonce);
  }

  .titre-fr {
    display: block;
    font-size: 1rem;
    line-height: 1.4;
    font-weight: 600;
    color: #57574F;
    margin-top: 3px;
  }

  /* --- lignes bilingues : arabe dominant, français juste en dessous --- */
  .ligne-bilingue {
    margin: 0 0 14px;
  }

  .ligne-bilingue:last-child {
    margin-bottom: 0;
  }

  .ligne-ar {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.6;
    color: var(--pz-gris-fonce);
    margin: 0;
  }

  .ligne-ar strong {
    color: var(--pz-bleu);
  }

  .ligne-fr {
    font-size: 0.92rem;
    font-weight: 500;
    line-height: 1.5;
    color: #57574F;
    margin: 3px 0 0;
  }

  .ligne-bilingue--accent .ligne-ar {
    color: var(--pz-bleu);
    font-size: 1.05rem;
  }

  /* --- bloc surligné doucement pendant la lecture audio --- */
  .bloc-accueil {
    border-radius: var(--rayon-btn);
    border: 2px solid transparent;
    padding: 10px 14px;
    margin: 0 0 20px;
    transition: border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
  }

  .bloc-accueil.lecture-active {
    border-color: var(--pz-bleu);
    background: var(--pz-bleu-clair);
    box-shadow: 0 0 0 6px rgba(54, 187, 214, 0.12);
  }

  /* --- bouton secondaire : écouter la consigne (bilingue) --- */
  .bouton-ecouter {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 54px;
    padding: 10px 24px;
    margin: 0 0 28px;
    font-family: inherit;
    background: var(--pz-blanc);
    border: 2px solid var(--pz-bleu);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .bouton-ecouter:hover {
    background: var(--pz-bleu-clair);
  }

  .bouton-ecouter:active {
    transform: scale(0.98);
  }

  .bouton-ecouter:focus-visible {
    outline: 3px solid var(--pz-gris-fonce);
    outline-offset: 2px;
  }

  .ecouter-ligne1 {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ecouter-ligne1 .ligne-ar {
    font-size: 1rem;
    font-weight: 700;
    color: var(--pz-bleu);
    margin: 0;
  }

  .bouton-ecouter .ligne-fr {
    font-size: 0.8rem;
    color: #6C8A94;
    margin: 0;
  }

  .bouton-ecouter.lecture-active {
    background: var(--pz-bleu);
  }

  .bouton-ecouter.lecture-active .ecouter-ligne1 .ligne-ar {
    color: var(--pz-blanc);
  }

  .bouton-ecouter.lecture-active .ligne-fr {
    color: rgba(255, 255, 255, 0.85);
  }

  .icone-haut-parleur {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--pz-bleu);
  }

  .bouton-ecouter.lecture-active .icone-haut-parleur {
    color: var(--pz-blanc);
  }

  /* --- composition graphique Pazapa (carrés/formes abstraites) --- */
  .composition {
    position: relative;
    width: 100%;
    max-width: 220px;
    height: 130px;
    margin: 0 auto 32px;
  }

  .forme {
    position: absolute;
    border-radius: 10px;
  }

  .forme--1 { inset-inline-start: 8%;  top: 14%; width: 46px; height: 46px; background: var(--pz-jaune); }
  .forme--2 { inset-inline-end: 10%;   top: 6%;  width: 30px; height: 30px; background: var(--pz-bleu); border-radius: 50%; }
  .forme--3 { inset-inline-start: 34%; top: 44%; width: 56px; height: 56px; background: var(--pz-vert); transform: rotate(8deg); }
  .forme--4 { inset-inline-end: 4%;    top: 58%; width: 26px; height: 26px; background: var(--pz-rouge); border-radius: 50%; }
  .forme--5 { inset-inline-start: 4%;  top: 66%; width: 20px; height: 20px; background: var(--pz-bleu); }

  /* --- écran d'entrée : bouton principal --- */
  #etape-entree {
    transition: opacity 0.35s ease;
  }

  #etape-entree.masquee {
    display: none;
  }

  .bouton {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    min-height: 58px;
    padding: 10px 16px;
    font-family: inherit;
    color: var(--pz-blanc);
    background: var(--pz-bleu);
    border: none;
    border-radius: var(--rayon-btn);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .bouton .ligne-ar {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--pz-blanc);
    margin: 0;
  }

  .bouton .ligne-fr {
    font-size: 0.82rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.88);
    margin: 0;
  }

  .bouton:hover:not(:disabled) {
    background: #2CA4BD;
  }

  .bouton:active:not(:disabled) {
    transform: scale(0.98);
  }

  .bouton:focus-visible {
    outline: 3px solid var(--pz-gris-fonce);
    outline-offset: 2px;
  }

  .bouton:disabled {
    background: var(--pz-gris-clair);
    cursor: not-allowed;
  }

  .bouton:disabled .ligne-ar,
  .bouton:disabled .ligne-fr {
    color: #9A9A98;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- responsive --- */
  @media (max-width: 768px) {
    .carte {
      padding: 32px 24px;
    }
    .titre-ar {
      font-size: 1.7rem;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }
    .carte {
      padding: 26px 18px;
      border-radius: 18px;
    }
    .titre-ar {
      font-size: 1.5rem;
    }
    .titre-fr {
      font-size: 0.92rem;
    }
    .ligne-ar {
      font-size: 1.08rem;
    }
    .ligne-bilingue--accent .ligne-ar {
      font-size: 0.98rem;
    }
    .composition {
      max-width: 180px;
      height: 110px;
    }
    .pixel {
      transform: scale(0.7);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .pixel,
    .carte {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .bouton,
    .bloc-accueil,
    .bouton-ecouter {
      transition: none !important;
    }
  }
</style>
</head>

      function activerSurlignage() {
        blocAccueil.classList.add("lecture-active");
        btnEcouter.classList.add("lecture-active");
      }

      function desactiverSurlignage() {
        blocAccueil.classList.remove("lecture-active");
        btnEcouter.classList.remove("lecture-active");
      }

      function ecouterAccueil() {
        // Une seule voix (arabe), aucune synthèse vocale, aucune API externe.
        // Si le fichier est absent, l'échec est géré silencieusement (aucune erreur visible pour l'enfant).
        try {
          audioAccueil.currentTime = 0;
        } catch (e) {
          // ignoré : le fichier n'est pas encore chargé
        }
        var lecture = audioAccueil.play();
        if (lecture && typeof lecture.catch === "function") {
          lecture.catch(function () {
            desactiverSurlignage();
          });
        }
      }

      audioAccueil.addEventListener("play", activerSurlignage);
      audioAccueil.addEventListener("pause", desactiverSurlignage);
      audioAccueil.addEventListener("ended", desactiverSurlignage);
      audioAccueil.addEventListener("error", desactiverSurlignage);

      btnEcouter.addEventListener("click", ecouterAccueil);

      function demarrer() {
        if (dejaDemarre) return; // protection contre double clic / double validation
        dejaDemarre = true;

        if (!audioAccueil.paused) {
          audioAccueil.pause();
        }

        btnIbda.disabled = true;
      }

      btnIbda.addEventListener("click", demarrer);
    })();
  </script>

</body>
</html>
